name: Django CI

on:
  push:
    branches: [ Feature-Jose ]
  pull_request:
    branches: [ Feature-Jose ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          python manage.py test clinica.tests.test_formsNombre  
          python manage.py test clinica.tests.test_Oposicion 
          python manage.py test clinica.tests.test_PaginaPaciente 
          python manage.py test clinica.tests.test_VistaServicio  
          pytest test_playwright/ 

